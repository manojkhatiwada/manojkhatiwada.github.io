<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Games</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/games.css">
  </head>
  <body>
    <a href="games.html" id="home-button">← Back to Games</a>
    <main class="games-container">
      <h1>Games</h1>
      <p class="lead">Click any game card below to play in a new tab</p>

      <div class="tabs" role="tablist" aria-label="Game categories">
        <button class="tab active" data-filter="all">All</button>
        <button class="tab" data-filter="arcade">Arcade</button>
        <button class="tab" data-filter="casual">Casual</button>
      </div>

      <div class="games-grid">
        <a class="game-card" href="snake.html" target="_blank" data-category="arcade">
          <div class="thumb snake-thumb"></div>
          <div class="meta"><h3>Snake</h3><p>Classic snake with multiple food types.</p></div>
        </a>

        <a class="game-card" href="rps.html" target="_blank" data-category="casual">
          <div class="thumb rps-thumb"></div>
          <div class="meta"><h3>Rock Paper Scissors</h3><p>Best-of-3 series with celebratory graphics.</p></div>
        </a>

      </div>

      <p class="note">Want a game added here? Add the HTML page to the repo and I’ll include it on this page.</p>
    </main>

    <script src="assets/js/games.js"></script>
  </body>
</html>
