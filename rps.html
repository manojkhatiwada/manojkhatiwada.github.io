<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rps.css">
    <style>
      /* Page theme adjusted to match cosmos.html visual style */
      *{box-sizing:border-box;margin:0;padding:0}
      body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1f2e;color:#FAF9F5;min-height:100vh}
      .rps-container{max-width:720px;margin:48px auto;padding:24px;background:rgba(26,31,46,0.6);border-radius:12px;box-shadow:0 10px 30px rgba(6,8,15,0.6);color:#FAF9F5}
      .rps-buttons{display:flex;gap:12px;justify-content:center;margin:18px 0}
      .rps-buttons button{padding:12px 20px;font-size:18px;cursor:pointer;border-radius:10px}
      .scoreboard{display:flex;gap:18px;justify-content:center;margin-top:12px}
      .scorebox{padding:8px 12px;border-radius:6px;background:rgba(255,255,255,0.03);text-align:center;color:rgba(250,250,250,0.9)}
      .result{margin-top:18px;text-align:center;font-size:20px;font-weight:600}
      .choice-display{margin-top:8px;text-align:center;color:rgba(250,250,250,0.8)}

      /* home button matching cosmos.html */
      #home-button{position:fixed;top:20px;right:20px;background:rgba(93,169,255,0.15);color:#5DA9FF;border:1px solid rgba(93,169,255,0.3);padding:10px 20px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:500;text-decoration:none;z-index:1000;backdrop-filter:blur(20px) saturate(180%)}
      #home-button:hover{background:rgba(93,169,255,0.25);border-color:rgba(93,169,255,0.5);transform:translateY(-2px);box-shadow:0 8px 22px rgba(93,169,255,0.12)}
    </style>
  </head>
  <body>
  <a href="index.html" id="home-button">← Back to Portfolio</a>
  <main class="rps-container">
      <h1 style="text-align:center">Rock — Paper — Scissors</h1>
      <p style="text-align:center">Play against the computer. Your session scoreboard (wins / losses / ties) is saved while the tab is open.</p>

      <div class="rps-buttons" role="group" aria-label="Rock Paper Scissors choices">
        <button id="btn-rock" data-choice="rock">🪨 Rock</button>
        <button id="btn-paper" data-choice="paper">📄 Paper</button>
        <button id="btn-scissors" data-choice="scissors">✂️ Scissors</button>
      </div>

      <div class="choice-display" id="choiceDisplay">Make a choice to start</div>

      <div class="result" id="result">—</div>

      <div class="scoreboard" aria-live="polite">
        <div class="scorebox">Wins: <span id="wins">0</span></div>
        <div class="scorebox">Losses: <span id="losses">0</span></div>
        <div class="scorebox">Ties: <span id="ties">0</span></div>
      </div>

      <div style="text-align:center;margin-top:12px">
        <div class="scorebox" style="display:inline-block">Series: <span id="seriesWins">0</span> — <span id="seriesLosses">0</span></div>
      </div>

      <div style="text-align:center;margin-top:18px">
        <button id="resetScore">Reset Score</button>
      </div>

      <p style="text-align:center;margin-top:18px;font-size:13px;color:#666">Tip: the scoreboard lives in sessionStorage so it resets when you close the tab.
      </p>
    </main>

    <!-- graffiti canvas sits on top when a series is won -->
    <canvas id="graffitiCanvas" class="graffiti-canvas" width="800" height="600" aria-hidden="true"></canvas>

    <script src="assets/js/rps.js"></script>
  </body>
</html>
